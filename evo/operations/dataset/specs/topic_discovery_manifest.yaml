# 主题发现的发布 Artifact。Cluster 只存在于上游算法过程，最终输出以 Topic 为唯一业务对象。
operation:
  op_id: dataset.topic_discovery_manifest
  flow: dataset
  stage: topic_discovery_manifest
  description: 将 entity / embedding 聚类结果展平为可展示、可编辑、可被 qaplan 消费的 Topic 集合。

fixed_op:
  inputs:
    entity_clusters:
      artifact_id: dataset.topic_discovery_entity_clusters
      required: true
      partition: unpartitioned
    embedding_clusters:
      artifact_id: dataset.topic_discovery_embedding_clusters
      required: true
      partition: unpartitioned
  outputs:
    topic_discovery_manifest:
      artifact_id: dataset.topic_discovery_manifest
      partition: unpartitioned

materializer:
  function: topic_discovery_manifest
  return_keys: [topic_discovery_manifest]

input_payload:
  entity_clusters:
    fields:
      clusters:
        type: array
        required: true
        item:
          fields:
            cluster_id: {type: string, required: true}
            cluster_type: {type: string, required: true, enum: [entity]}
            topics: {type: 'list[string]', required: true}
            chunk_ids: {type: 'list[string]', required: true}
            chunk_count: {type: integer, required: true}
  embedding_clusters:
    fields:
      clusters:
        type: array
        required: true
        item:
          fields:
            cluster_id: {type: string, required: true}
            cluster_type: {type: string, required: true, enum: [embedding]}
            topics: {type: 'list[string]', required: true}
            chunk_ids: {type: 'list[string]', required: true}
            chunk_count: {type: integer, required: true}

output_payload:
  topic_discovery_manifest:
    json_compatible: true
    fields:
      topics:
        # API 的唯一主题集合；不得输出 cluster / source_cluster_id / scores / metadata。
        type: array
        item:
          fields:
            topic_id:
              # 不透明业务主键。前端仅保存和回传；不能解析其格式。
              type: string
            name:
              type: string
            question_type:
              # entity 映射 precision，embedding 映射 reasoning。
              type: string
              enum: [precision, reasoning]
            chunk_ids:
              # 该 Topic 的稳定支撑 Chunk 顺序；详情页读取当前有效 Chunk，任一上游变化都会使本 Manifest 失效。
              type: list[string]
            chunk_count:
              # 必须等于 chunk_ids 长度。
              type: integer
      stats:
        fields:
          total_topic_count: {type: integer}
          question_types:
            fields:
              precision:
                fields:
                  count: {type: integer}
              reasoning:
                fields:
                  count: {type: integer}

execution_flow:
  - 校验两路 Cluster 的 topics、chunk_ids 均为非空字符串列表，且 chunk_count 等于 chunk_ids 长度。
  - 按 entity Cluster 顺序、其 topics 顺序、embedding Cluster 顺序、其 topics 顺序展开。
  - 每个展开 Topic 复制所属 Cluster 的 chunk_ids/chunk_count；entity 赋值 question_type=precision，embedding 赋值 question_type=reasoning。
  - 为本次主题发现结果中的每个 Topic 创建唯一、不透明 topic_id。主题发现重新执行产生新集合时允许整体换 ID；仅用户重命名时必须保留 ID。
  - name 允许重复；Topic 的身份是 topic_id，不是名称或 Chunk 集合。
  - 任一路 clusters=[] 时，仍正常展平并发布另一路 Topic；不得因单一路为空失败。
  - 两路均为空时输出 topics=[]、三个统计均为 0 的合法稳定空结果。
  - 返回 {"topic_discovery_manifest": payload}。

tests:
  flattening_and_identity:
    # 验证最终 Artifact 完全以 Topic 为对象，不泄露上游 Cluster 模型。
    cases:
      # entity 的 Cluster 和其中 topics 先展开，再接 embedding；每一路均保留原有相对顺序。
      - flattens_entity_then_embedding_and_preserves_source_topic_order
      # 同一输入 Cluster 的 type 必须稳定映射为产品题型，而不是将 entity/embedding 暴露给前端。
      - maps_entity_to_precision_and_embedding_to_reasoning
      # 同名 Topic 可以并存，但 topic_id 必须唯一且前端不应依赖其格式。
      - creates_unique_opaque_topic_ids_and_does_not_require_unique_names
      # 一个 Cluster 展开的多个 Topic 共用该 Cluster 的引用 Chunk；chunk_count 必须与数组长度一致。
      - copies_each_source_cluster_chunk_ids_and_chunk_count_to_every_expanded_topic
      # 发布结果不包含任何 Cluster 定位、算法评分或算法元数据，避免前端依赖内部模型。
      - does_not_emit_cluster_source_cluster_id_scores_or_metadata
      # 无自动材料时，空输入仍应输出可查询的空主题集合与零统计。
      - empty_inputs_return_a_valid_empty_topic_collection
  validation:
    cases:
      # entity/embedding 来源混用、topics 非数组或 Topic 文本为空时必须拒绝。
      - rejects_wrong_source_cluster_type_or_non_list_topics
      # ID 不能为空或重复，支撑 Chunk ID 不能为空；名称不要求跨 Topic 唯一。
      - rejects_empty_topic_name_duplicate_topic_id_or_invalid_chunk_id
      # 防止难度容量与详情引用产生不一致。
      - rejects_chunk_count_not_matching_chunk_ids
      # FixedOp materializer 只能返回声明的一个输出键。
      - return_keys_match_outputs
  runtime_wiring:
    cases:
      # 两个无分区的内部聚类 Artifact 必须收敛为一个可版本化的 Topic Manifest。
      - merges_two_unpartitioned_cluster_artifacts_into_one_topic_manifest
