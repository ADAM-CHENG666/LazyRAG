# STEP2 默认总览的已实现契约；保持输出精简，并提供 Topic 统计与可编辑来源定位。
operation:
  op_id: dataset.topic_discovery_manifest
  flow: dataset
  stage: topic_discovery_manifest
  description: 聚合两类 Topic，输出 Topic–Cluster–Chunk 关系及 STEP2 总览统计。

fixed_op:
  inputs:
    entity_clusters:
      artifact_id: dataset.topic_discovery_entity_clusters
      required: true
      partition: unpartitioned
    embedding_clusters:
      artifact_id: dataset.topic_discovery_embedding_clusters
      required: true
      partition: unpartitioned
  outputs:
    topic_discovery_manifest:
      artifact_id: dataset.topic_discovery_manifest
      partition: unpartitioned

materializer:
  function: topic_discovery_manifest
  return_keys:
    - topic_discovery_manifest

input_payload:
  entity_clusters:
    fields:
      clusters:
        type: array
        required: true
        item:
          type: object
          fields:
            cluster_id:
              type: string
              required: true
            cluster_type:
              type: string
              required: true
              enum:
                - entity
            topics:
              type: list[string]
              required: true
              validation:
                - non_empty
            chunk_ids:
              type: list[string]
              required: true
              validation:
                - non_empty
            chunk_count:
              type: integer
              required: true
            scores:
              type: object
              required: false
              default: {}
            metadata:
              type: object
              required: false
              default: {}
      stats:
        type: object
        required: false
      params:
        type: object
        required: false
  embedding_clusters:
    fields:
      clusters:
        type: array
        required: true
        item:
          type: object
          fields:
            cluster_id:
              type: string
              required: true
            cluster_type:
              type: string
              required: true
              enum:
                - embedding
            topics:
              type: list[string]
              required: true
              validation:
                - non_empty
            chunk_ids:
              type: list[string]
              required: true
              validation:
                - non_empty
            chunk_count:
              type: integer
              required: true
            scores:
              type: object
              required: false
              default: {}
            metadata:
              type: object
              required: false
              default: {}
      skipped_chunks:
        type: array
        required: false
        default: []
      stats:
        type: object
        required: false
      params:
        type: object
        required: false

output_payload:
  topic_discovery_manifest:
    json_compatible: true
    fields:
      clusters:
        # Topic 审阅页的主数据。一个 cluster 可包含多个 topics，并共享同一组 chunk_ids。
        type: array
        item:
          type: object
          fields:
            cluster_id:
              # 最终 manifest 内的稳定 ID，供 qaplan 引用；前端不得用它反推上游数组位置。
              type: string
            source_cluster_id:
              # 上游 entity_clusters / embedding_clusters 中的 cluster_id；
              # 前端编辑 topics 时使用该字段定位目标，不依赖数组下标。
              type: string
            cluster_type:
              # 前端映射为业务名称：entity=精确检索主题，embedding=综合推理主题。
              type: string
              enum:
                - entity
                - embedding
            topics:
              # Topic 审阅页按此数组展开为“一行一个 Topic”。
              # 本 manifest 只读；编辑目标是 source_cluster_id 指向的上游 clusters[].topics。
              type: list[string]
            chunk_ids:
              # Topic 的支撑 Chunk；用户展开 Topic 或点击详情时再按需读取 Chunk Artifact。
              type: list[string]
            chunk_count:
              # 必须等于 chunk_ids 长度，也是 1 / 2 / 3+ 支撑能力分档的唯一依据。
              type: integer
      stats:
        # STEP2 默认总览的唯一数据源；前端不遍历 clusters 重复计算业务统计。
        type: object
        fields:
          total_topic_count:
            # 所有 clusters[].topics[] 项的总数，不跨 Cluster 或跨类型再次去重。
            type: integer
          unique_chunk_count:
            # 两类 Cluster 引用到的不同 chunk_id 数，仅表示覆盖范围。
            type: integer
          topic_types:
            # 两类 Topic 的并列统计；key 与 cluster_type 保持一致。
            type: object
            fields:
              entity:
                type: object
                fields:
                  cluster_count:
                    # entity 类型 Cluster 数；不是 Topic 数。
                    type: integer
                  topic_count:
                    # entity clusters 中 topics[] 项的总数。
                    type: integer
                  support_distribution:
                    # 统计单位是 Topic，不是 Cluster。
                    type: object
                    fields:
                      one_chunk:
                        # 所属 Cluster 的 chunk_count=1 的 Topic 数。
                        type: integer
                      two_chunks:
                        # 所属 Cluster 的 chunk_count=2 的 Topic 数。
                        type: integer
                      three_or_more_chunks:
                        # 所属 Cluster 的 chunk_count>=3 的 Topic 数。
                        type: integer
              embedding:
                type: object
                fields:
                  cluster_count:
                    # embedding 类型 Cluster 数；不是 Topic 数。
                    type: integer
                  topic_count:
                    # embedding clusters 中 topics[] 项的总数。
                    type: integer
                  support_distribution:
                    type: object
                    fields:
                      one_chunk:
                        # 所属 Cluster 的 chunk_count=1 的 Topic 数。
                        type: integer
                      two_chunks:
                        # 所属 Cluster 的 chunk_count=2 的 Topic 数。
                        type: integer
                      three_or_more_chunks:
                        # 所属 Cluster 的 chunk_count>=3 的 Topic 数。
                        type: integer

execution_flow:
  - 读取并校验 entity_clusters 与 embedding_clusters。
  - 校验两路所有 clusters 的 topics 均为非空 list[string]。
  - 按 entity first、embedding second 合并 clusters。
  - 当两路 clusters 均为空时，返回 clusters=[] 与零值统计的合法空 manifest，供 auto_case_count=0 的 qaplan 旁路使用。
  - 生成稳定最终 cluster_id，例如 entity_000001、embedding_000001。
  - 保留上游 cluster_id 为 source_cluster_id，并输出 cluster_type、topics、chunk_ids 和 chunk_count。
  - 不向最终 manifest 透传 scores、metadata 或空 params；详情数据由前端按需读取上游 Artifact。
  - total_topic_count 按所有 clusters[].topics[] 项计数，不在 manifest 再次去重。
  - 分别按 entity、embedding 汇总 cluster_count、topic_count 和 1 / 2 / 3+ Chunk 支撑分布。
  - 汇总 unique_chunk_count。
  - 返回 {"topic_discovery_manifest": payload}。

tests:
  manifest_merge_logic:
    # 合并主逻辑：固定顺序合并两类 Topic，并生成 STEP2 总览所需的最小 manifest。
    cases:
      # 正常两路 cluster 输入能合并出最终 manifest，只保留关系、编辑定位字段与总览统计。
      - success
      # 最终 clusters 顺序固定为 entity first、embedding second，不按 topic 或 chunk 数重新排序。
      # 例子：即使 embedding path 的 cluster 在输入里更早准备好，最终输出也必须先列出所有 entity clusters，再列出 embedding clusters。
      - entity_first_embedding_second
      # 不做跨来源去重：即使 entity 与 embedding path 命中同一批 chunk，也保留两条 cluster 记录。
      # 例子：entity cluster 和 embedding cluster 都引用 ['chunk-1', 'chunk-2'] 时，最终 manifest 仍保留两条记录，而不是合并成一条。
      - no_cross_source_dedup
      # 最终 cluster_id 稳定生成为 entity_000001、embedding_000001 这类形式，不复用上游 id。
      # 例子：上游传入 entity_cluster_000005 和 embedding_cluster_000010，最终仍重新编号为 entity_000001、embedding_000001。
      - stable_cluster_ids
      # source_cluster_id 保留上游 ID，供前端稳定定位可编辑 Artifact 中的 clusters[].topics。
      - source_cluster_ids
      # Topic 数、Cluster 数、1 / 2 / 3+ 支撑分布和 unique_chunk_count 与输出一致。
      - topic_stats
      # materializer 返回结构固定为 {"topic_discovery_manifest": payload}，不混入额外字段。
      - return_keys_match_outputs
  input_validation:
    # 输入契约与失败路径：看两路 clusters 的 topics / chunk_ids / cluster_type 是否合法，坏输入是否立即失败。
    cases:
      # entity_clusters.clusters 与 embedding_clusters.clusters 都必须是 list，且 cluster_type 必须与来源匹配。
      # 例子：entity_clusters.clusters 不是 list，或 entity 路里混入 cluster_type=embedding，都应直接失败。
      - contract
      # chunk_count、scores、metadata 等上游字段类型非法时应立即抛错，不生成部分 manifest。
      # scores 与 metadata 虽不再输出，仍属于当前上游输入契约。
      - validation_error
      # 任一路 cluster 的 topics 为空、含空字符串或不是 list[string] 时直接失败。
      # 例子：topics=[]、topics=['']、topics='Tesla' 都应直接失败。
      - empty_topics_error
      # 两路空 cluster 能形成稳定空 manifest；仅非空 cluster 需要 topics 非空。
      - imported_only_empty_manifest_bypass
  runtime_wiring:
    # fixed op 接线：看两路 unpartitioned clusters 在 runtime 中是否能汇总为最终 manifest。
    cases:
      # runtime 中 entity_clusters 与 embedding_clusters 能稳定汇总为单个 topic_discovery_manifest。
      - partition
