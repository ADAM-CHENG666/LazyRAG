# 材料有效性扫描与初始入围：有效 Chunk 全量保留，入围性可由用户直接修改。
operation:
  op_id: dataset.build_chunk_candidates
  flow: dataset
  stage: build_chunk_candidates
  description: 按有效性规则扫描已入选文档，冻结每文档/切分规则配额，并生成带入围标记的完整有效 Chunk 集合。

fixed_op:
  inputs:
    selected_docs:
      artifact_id: dataset.selected_docs
      required: true
      partition: unpartitioned
    import_cases_manifest:
      artifact_id: dataset.import_cases_manifest
      required: true
      partition: unpartitioned
    build_chunks_params:
      artifact_id: dataset.build_chunks_params
      required: true
      partition: unpartitioned
  outputs:
    build_chunk_candidates:
      artifact_id: dataset.build_chunk_candidates
      partition: unpartitioned

materializer:
  function: build_chunk_candidates
  return_keys: [build_chunk_candidates]

input_payload:
  selected_docs:
    fields:
      documents: {type: array, required: true}
  import_cases_manifest:
    fields:
      stats:
        fields:
          case_allocation:
            fields:
              auto_case_count: {type: integer, required: true}
  build_chunks_params:
    fields:
      groups:
        # 已选切分规则及其优先级；Service 只提交当前材料来源均支持的标准规则 ID。
        type: list[string]
        required: false
        default: [block]
        validation: [non_empty, non_empty_after_strip_items, unique_items]
      allowed_types:
        # 已启用的标准版面类型，是平台标准目录的子集，不等同于解析器能够产出的全部类型。
        # Service 负责校验每项为当前材料来源 supported=true 的标准 ID；算法拒绝未知标准 ID。
        # 当前标准 ID：text、heading、paragraph、table、formula、figure、code、list、unknown；image→figure、equation→formula。
        type: list[string]
        required: false
        default: [text, paragraph, table, formula, unknown]
        validation: [non_empty, non_empty_after_strip_items, unique_items]
      max_scan_docs_per_kb:
        type: integer
        required: false
        default: 10000
        validation: [positive_integer]
      max_scan_chunks:
        type: integer
        required: false
        default: 100000
        validation: [positive_integer]

output_payload:
  build_chunk_candidates:
    json_compatible: true
    fields:
      chunks:
        # 全部有效 Chunk；selected 是可编辑的入围性，不参与有效性判定。
        type: array
        item:
          type: object
          fields:
            kb_id: {type: string}
            doc_id: {type: string}
            chunk_id: {type: string}
            filename: {type: string}
            group: {type: string}
            # Reader 原始 metadata.type 经规范化后的标准版面类型；用于详情展示和 allowed_types 过滤。
            type: {type: string}
            text: {type: string}
            embedding: {type: object}
            metadata: {type: object}
            discovery_index: {type: integer}
            selected: {type: boolean}
            selection_index:
              # 未入围为 null；入围项按稳定顺序连续编号。
              type: integer
              nullable: true
      quotas:
        # 冻结的精确入围数；直接编辑 selected 后必须仍满足此约束。
        type: array
        item:
          type: object
          fields:
            kb_id: {type: string}
            doc_id: {type: string}
            group: {type: string}
            required: {type: integer}
      summary:
        fields:
          scanned_chunk_count: {type: integer}
          effective_count: {type: integer}
          selected_count: {type: integer}
          shortfall_count: {type: integer}

execution_flow:
  - 仅扫描 selected_docs.documents 中 included=true 的文档；groups 和 allowed_types 只决定有效性，不表达入围选择。
  - 先将各 Reader 的原始 metadata.type 规范化为标准版面类型，再按 allowed_types、正文、Embedding 判定有效；无效 Chunk 不写入 chunks。
  - allowed_types 仅可包含平台标准版面类型 ID；当前解析链路是否支持某标准类型由 Service/Core 校验，算法不得通过扫描历史 Chunk 推断支持目录。
  - 对全部有效 Chunk 保留正文、Embedding、来源与稳定 discovery_index；不得在达到配额后停止读取或丢弃未入围有效 Chunk。
  - 按 groups 优先级、知识库、文档分配初始配额；写入 quotas，并将初始入围 Chunk 标记 selected=true 和连续 selection_index。
  - 直接修改 chunks[].selected 属于用户入围调整：Service 使用 update_artifacts() 写入完整新值，校验每条 quota 后只重算下游；不得重跑本 operation。
  - 修改 groups、allowed_types、文档 included 或扫描上限属于有效性规则修改：更新输入 Artifact 并重跑本 operation。
  - auto_case_count=0 时返回空 chunks、quotas 与零值 summary。

tests:
  effective_chunk_snapshot:
    cases:
      # included=false 的文档不得访问 Chunk，也不得出现在有效快照。
      - scans_only_included_documents
      # 所有通过有效性规则的 Chunk 都保留，顺序必须可复现，不能只输出初始入围项。
      - retains_every_effective_chunk_in_stable_discovery_order
      # 原始 Reader 类型先映射为标准类型；映射后不在 allowed_types、正文为空、Embedding 缺失或非法任一失败时，该 Chunk 不得进入有效快照。
      - excludes_invalid_type_empty_or_embedding_invalid_chunks_from_snapshot
      # MinerU、PaddleOCR、DOCX 与基础 Reader 的同义类型必须映射为同一标准 ID，再决定是否允许进入有效快照。
      - normalizes_reader_layout_types_before_allowed_type_filtering
      # allowed_types 含非标准 ID 时必须失败，防止绕过 Service 目录校验直接写入未知版面类型。
      - rejects_non_standard_allowed_type_ids
      # 每个有效 Chunk 都保存详情页与后续算法需要的正文、向量和来源字段。
      - full_effective_snapshot_keeps_text_embedding_and_source_provenance
      # 超过扫描上限必须整体失败，禁止返回截断的“有效快照”。
      - scan_limits_fail_without_partial_snapshot
  initial_selection_and_quota:
    cases:
      # 相同输入重复执行时，Group 优先级与稳定分配必须选出相同 Chunk。
      - group_priority_and_stable_allocation_produce_deterministic_selected_chunks
      # 每个 (KB、文档、Group) 的 selected 数量恰好等于冻结 required 配额。
      - each_document_group_quota_matches_initial_selected_count
      # 入围项按稳定顺序获得连续编号；未入围项的 selection_index 必须为 null。
      - selected_chunks_have_contiguous_selection_index_and_others_are_null
      # 容量不足但非零时仍返回所有有效 Chunk，并准确记录短缺数量。
      - positive_shortfall_returns_all_effective_chunks_and_records_shortfall
      # 仍需自动生成且没有任何有效 Chunk 时失败，避免产生不可用的空材料。
      - zero_effective_capacity_fails_when_auto_generation_is_required
  manual_selection_update_contract:
    cases:
      # 用同文档同规则下的另一个有效 Chunk 替换入围项，不改变有效 Chunk 集合。
      - replacing_selected_ids_without_changing_effective_snapshot_is_valid
      # 任一配额组少选、多选或选入该组外 Chunk 时，更新必须被拒绝。
      - selected_count_must_equal_required_for_every_document_group_quota
      # update_artifacts 修改 selected 后，只重算 build_chunks 及下游，不执行候选扫描 operation。
      - direct_candidate_update_invalidates_downstream_without_rerunning_candidate_scan
      # materializer 返回键必须严格等于 FixedOp 输出键。
      - return_keys_match_outputs
