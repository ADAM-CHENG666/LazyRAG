operation:
  op_id: dataset.generate
  flow: dataset
  stage: generate
  description: 对导入基础 case 直接透传，或基于单个 qaplan spec 生成 QA 原型 case。

fixed_op:
  inputs:
    qaplan_spec:
      artifact_id: dataset.qaplan_spec
      required: true
      partition: partitioned
      mapping: same_partition
    run_config:
      artifact_id: run.config
      required: true
      partition: unpartitioned
      mapping: unpartitioned_to_all
  outputs:
    case:
      artifact_id: dataset.case
      partition: partitioned

materializer:
  function: generate
  return_keys:
    - case

input_payload:
  qaplan_spec:
    fields:
      id:
        type: string
        required: true
        validation:
          - non_empty_after_strip
      mode:
        # 控制本分区直接返回导入 case，还是调用 LLM 生成。
        type: string
        required: true
        enum:
          - imported
          - generated
      imported_case:
        type: object
        required: false
      question_type:
        type: string
        required: false
        enum:
          - precision
          - reasoning
      difficulty:
        type: string
        required: false
        enum:
          - easy
          - medium
          - hard
      instruction:
        type: string
        required: false
        validation:
          - non_empty_after_strip
      topic:
        type: object
        required: false
        fields:
          topic_id: {type: string, required: true}
          name: {type: string, required: true, validation: [non_empty_after_strip]}
      qaplan:
        type: object
        required: false
        fields:
          plan_item_id:
            type: string
            required: true
          lane:
            type: string
            required: true
      references:
        type: array
        required: false
        item:
          type: object
          fields:
            kb_id:
              type: string
              required: true
            chunk_id:
              type: string
              required: true
            doc_id:
              type: string
              required: true
            text:
              type: string
              required: true
  run_config:
    fields:
      llm_config:
        type: object
        required: true

output_payload:
  case:
    json_compatible: true
    fields:
      # 与当前输出分区相同、来自知识库 dataset flow 的稳定 case 标识。
      id:
        type: string
      # QAplan 的两种问题类型，不沿用旧的 hop 枚举。
      question_type:
        type: string
        enum:
          - precision
          - reasoning
      difficulty:
        type: string
        enum:
          - easy
          - medium
          - hard
      # LLM 生成、面向被评测 RAG 系统的自然语言问题。
      question:
        type: string
      # 由参考资料唯一支持的标准答案。
      answer:
        type: string
      # 简约说明本题的考察或设计逻辑，供后续判罚辅助使用。
      grading_guidance:
        type: string
      # 所有 Case 统一按参考资料原始顺序保存完整引用，供详情、判分与人工审阅。
      references:
        type: array
        item:
          type: object
          fields:
            kb_id:
              type: string
            doc_id:
              type: string
            chunk_id:
              type: string
            text:
              type: string
      # 以下字段为既有下游兼容输出；均可由 references 派生，暂不移除。
      reference_context:
        # 保持原有 [{chunk_id, text}] 结构与 references 相同顺序。
        type: array
        item:
          type: object
          fields:
            chunk_id: {type: string}
            text: {type: string}
      reference_chunk_ids:
        type: list[string]
      reference_doc_ids:
        type: list[string]
      source_preparation:
        type: object
        fields:
          kb_ids:
            type: list[string]

execution_flow:
  - 读取当前 case 输出分区，要求它与同分区 qaplan_spec.id 一致，并按 qaplan_spec.mode 选择唯一分支。
  - mode=imported 时，校验 imported_case 是完整基础 case，且 imported_case.id 等于当前分区；不调用 LLM，原样返回 {"case": imported_case}。
  - mode=generated 时，校验 qaplan_spec 的 question_type、difficulty、instruction、topic 和 references；references 必须非空，且每项的 kb_id、doc_id、chunk_id、text 均为真实知识库标识或正文。
  - 按 references 原始顺序为每份资料添加稳定短别名，例如 <reference id="ref_1">、<reference id="ref_2">，并保留完整正文。
  - 先写入通用 QA 约束与三字段输出契约，再追加 qaplan_spec.instruction、topic.name 和带短别名参考资料；要求模型只使用给定资料，question 与 answer 均实质使用全部 references，不补充外部事实。
  - 调用 run_config.llm_config 指定的生成模型，并要求返回 JSON object：question、answer、grading_guidance。
  - 使用 dataset.llm_json 基础设施解析与修复 JSON；校验 question、answer、grading_guidance 均为非空字符串。JSON 无法解析、字段缺失或类型错误时，按基础设施规则携带校验错误重试一次，仍失败则直接报错。
  - 构造 generated case：复制 id、question_type、difficulty 和按原顺序的完整 references[]；每项必须包含 kb_id、doc_id、chunk_id、text；同时从该数组派生并保留既有 reference_context、reference_chunk_ids、reference_doc_ids 与 source_preparation，保证下游兼容。
  - 返回 {"case": payload}。key_points 与 forbidden_claims 不属于本 operation，由后续 enhancement 流程负责。

tests:
  prompt_construction:
    # Prompt 构造：验证 generate 仅消费同分区 qaplan_spec 的确定性材料，并将三字段输出契约明确交给模型。
    cases:
      # instruction、topic 和每份完整 reference text 都进入 prompt；不重新选择 cluster、topic 或 chunk。
      - uses_preparation_as_only_generation_source
      # references 按 qaplan_spec 原始顺序标记为 ref_1、ref_2 等，避免模型混淆材料来源。
      # 例子：references=[chunk_b, chunk_a] 时，chunk_b 必须是 ref_1。
      - stable_reference_labels_and_order
      # prompt 明确要求 question 与 answer 均实质使用全部参考资料，并且只依据参考资料生成，不补充外部事实。
      - grounded_question_and_answer_instruction
      # prompt 只要求 question、answer、grading_guidance 三个 LLM 输出字段；不再要求 key_points、forbidden_claims 或证据短别名字段。
      - requests_only_question_answer_and_grading_guidance
  case_generation:
    # 成功路径：验证三字段模型输出与 qaplan_spec 的确定性元数据合并为基础 QA prototype。
    cases:
      # 合法模型 JSON 能生成仅含 question、answer、grading_guidance 与确定性元数据的 case。
      - success
      # imported case 经过完整校验后直接成为基础 case，不调用生成模型，也不补齐缺失字段。
      - imported_case_direct_return_without_llm
      # precision 与 reasoning 均沿用 qaplan_spec 的问题类型；generate 不重新解释或改写其类型。
      - preserves_question_type
      # easy、medium、hard 均沿用 qaplan_spec 的难度；generate 不根据答案长度或 guidance 内容重新分类。
      - preserves_difficulty
      # case 保留完整四字段 references，同时从其稳定派生旧的 context、Chunk/文档 ID 列表和 KB 摘要，保证现有下游不改接口。
      - preserves_complete_references_and_legacy_derived_fields
      # references 的顺序变化必须同步反映到 reference_context、Chunk/文档 ID 列表；不得分别排序或去重重排。
      - keeps_legacy_reference_fields_ordered_and_consistent_with_references
      # materializer 返回结构固定为 {"case": payload}，不混入额外 output key。
      - return_keys_match_outputs
  model_output_validation:
    # 模型输出与 repair：验证 JSON 基础设施只保障结构化三字段契约，不重新引入增强字段校验。
    cases:
      # 模型返回非 JSON、JSON array 或空 object 时，经一次 repair 重试后仍无法解析则失败。
      - invalid_json_object_error
      # question、answer、grading_guidance 缺失、类型错误或空白时直接进入基础设施的内容修复路径。
      - required_text_field_error
      # 首次内容校验失败时，将校验错误交给 llm_json 的统一 repair 机制；第二次仍失败才报错。
      - one_repair_retry_on_content_validation_error
      # LLM 调用异常直接向上抛出，不生成部分 case 或伪造默认 QA。
      - llm_failure_error
      # repair 成功时仅接受修复后的完整三字段 JSON；不得沿用首次失败响应中的部分 question、answer 或 guidance。
      - repair_success_replaces_incomplete_first_response_atomically
  qaplan_spec_validation:
    # 上游 qaplan_spec 契约：验证生成前即拒绝分区错位、必填信息缺失或不完整参考资料。
    cases:
      # qaplan_spec.id 必须等于当前 case 输出分区，避免并行执行时把 QA 写到错误 case。
      - same_partition_case_id_error
      # question_type、difficulty、instruction、topic、qaplan 均为必填且必须合法，且 qaplan 不得包含 Cluster 或历史轮次字段。
      - qaplan_spec_contract_error
      # imported / generated 之外的 mode，或与分支不匹配的字段组合，必须在调用模型前失败。
      - mode_branch_contract_error
      # references 不能为空，且每份资料必须具备非空 kb_id、chunk_id、doc_id、text。
      - reference_contract_error
      # run_config.llm_config 缺失或不是 object 时直接失败。
      - run_config_contract_error
      # generated spec 的 topic 必须同时具备 topic_id 与非空 name；旧的纯字符串 topic 契约不得被静默兼容。
      - structured_topic_contract_error
  runtime_wiring:
    # fixed op 接线：验证 qaplan_spec 使用 same_partition 输入，run_config 使用 unpartitioned_to_all 广播，并产生同分区 dataset.case。
    cases:
      # runtime 为每个 case 分区创建一个 dataset.generate[case_xxxx] 实例，读取对应 qaplan_spec 并写入对应 dataset.case 分区。
      - partition
