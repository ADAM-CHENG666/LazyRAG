operation:
  op_id: dataset.qaplan_generate_manifest
  flow: dataset
  stage: qaplan_generate_manifest
  description: 汇总所有 qaplan_generate 分区结果，作为 dataset-only flow 的完成标记。

fixed_op:
  inputs:
    cases:
      artifact_id: dataset.case
      required: true
      partition: partitioned
      mapping: all_to_unpartitioned
  outputs:
    qaplan_generate_manifest:
      artifact_id: dataset.qaplan_generate_manifest
      partition: unpartitioned

materializer:
  function: qaplan_generate_manifest
  return_keys:
    - qaplan_generate_manifest

input_payload:
  cases:
    tuple: true
    item:
      fields:
        id:
          type: string
          required: true
        question_type:
          type: string
          required: true
        difficulty:
          type: string
          required: true
        key_points:
          type: array
          required: true
          item:
            type: object
            fields:
              statement:
                type: string
                required: true
              evidence_chunk_ids:
                type: list[string]
                required: true
        reference_chunk_ids:
          type: list[string]
          required: true

output_payload:
  qaplan_generate_manifest:
    json_compatible: true
    fields:
      cases:
        type: array
      stats:
        type: object
        fields:
          case_count:
            type: integer
          question_type_counts:
            type: object
          difficulty_counts:
            type: object

execution_flow:
  - 汇总 all_to_unpartitioned 的 case tuple。
  - 校验每个 case 的稳定 id、问题类型、难度、带真实 evidence_chunk_ids 的 key_points 和真实 reference_chunk_ids。
  - 输出轻量审计索引与分布统计；不改写 case 内容，不承担 assemble 职责。

tests:
  - success
  - duplicate_id_error
  - return_keys_match_outputs
