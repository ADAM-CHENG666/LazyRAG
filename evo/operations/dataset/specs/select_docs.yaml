# 材料文档发现：文档是否参与扫描是配置，不改变“被发现”的事实。
operation:
  op_id: dataset.select_docs
  flow: dataset
  stage: select_docs
  description: 枚举已选知识库的全部文档，保留稳定发现顺序并标记是否参与 Chunk 扫描。

fixed_op:
  inputs:
    source_config:
      artifact_id: corpus.source_config
      required: true
      partition: unpartitioned
    select_docs_params:
      artifact_id: dataset.select_docs_params
      required: true
      partition: unpartitioned
  outputs:
    selected_docs:
      artifact_id: dataset.selected_docs
      partition: unpartitioned

materializer:
  function: select_docs
  return_keys: [selected_docs]

input_payload:
  source_config:
    fields:
      kb_ids:
        type: list[string]
        required: true
        validation: [non_empty, non_empty_after_strip_items, unique_items]
  select_docs_params:
    fields:
      excluded_docs:
        # 用户只提交排除项；Service/Core 先校验知识库访问权限。
        type: array
        required: false
        default: []
        validation:
          - unique_by: [kb_id, doc_id]
        item:
          type: object
          fields:
            kb_id: {type: string, required: true}
            doc_id: {type: string, required: true}

output_payload:
  selected_docs:
    json_compatible: true
    fields:
      documents:
        # 唯一文档列表；Service 以此列表分页、筛选并展示 included。
        type: array
        item:
          type: object
          fields:
            kb_id: {type: string}
            doc_id: {type: string}
            filename: {type: string}
            file_type: {type: string}
            status: {type: string}
            included: {type: boolean}
            discovery_index: {type: integer}
      stats:
        fields:
          discovered_count: {type: integer}
          included_count: {type: integer}
          excluded_count: {type: integer}

execution_flow:
  - 按 source_config.kb_ids 顺序枚举每个知识库；保持知识库内的原始文档顺序。
  - 每个文档仅出现一次，按全局顺序写入 discovery_index；使用 (kb_id, doc_id) 判断 included。
  - excluded_docs 中未命中当前发现集的引用保留在配置中，但不写入 documents、也不影响统计。
  - 自动生成 Case 为 0 时仍输出文档发现结果；后续 Chunk 扫描节点可依据自动生成数量跳过扫描。
  - 要求 discovered_count = included_count + excluded_count。

tests:
  discovery_and_inclusion:
    cases:
      # 两个 KB 各有多份文档时，输出顺序必须先遵循 kb_ids，再遵循来源返回顺序。
      - stable_order_is_kb_order_then_source_document_order
      # discovery_index 从 0 连续递增，不因文档是否入选而跳号或重排。
      - every_discovered_document_has_one_monotonic_discovery_index
      # 被排除文档仍在 documents[] 中，只将 included 置为 false。
      - excluded_document_remains_in_list_with_included_false
      # 当前发现集外的排除配置不污染列表和统计，保留到其文档再次出现时生效。
      - unmatched_exclusion_is_dormant_and_does_not_change_counts
      # 相同 doc_id 位于不同 KB 时是两条独立记录，定位必须使用复合键。
      - document_identity_is_composite_kb_id_and_doc_id
  boundary_and_validation:
    cases:
      # 即使没有自动生成 Case，调整材料页仍可查看并修改文档参与状态。
      - imported_only_run_still_returns_document_configuration_view
      # 已选 KB 不含文档时返回空列表与全零统计，不把“没有材料”伪装成请求错误。
      - empty_discovery_is_a_valid_empty_document_list
      # KB/文档 ID 为空、含空白或出现重复复合键时拒绝参数。
      - rejects_empty_duplicate_or_whitespace_document_selection_ids
      # materializer 返回键必须严格等于 FixedOp 输出键。
      - return_keys_match_outputs
