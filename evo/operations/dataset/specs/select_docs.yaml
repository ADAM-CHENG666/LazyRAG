operation:
  op_id: dataset.select_docs
  flow: dataset
  stage: select_docs
  description: 从指定知识库中选择本次 dataset 构建要使用的文档集合。

fixed_op:
  inputs:
    source_config:
      artifact_id: corpus.source_config
      required: true
      partition: unpartitioned
      mapping: same_partition
  outputs:
    selected_docs:
      artifact_id: dataset.selected_docs
      partition: unpartitioned

materializer:
  function: select_docs
  return_keys:
    - selected_docs

input_payload:
  source_config:
    fields:
      kb_id:
        type: string
        required: true
        validation:
          - non_empty_after_strip
      max_docs:
        type: integer
        required: false
        default: 100
        validation:
          - positive_integer
          - max_value: 100000
      target_case_count:
        type: integer
        required: false
        default: 100
        validation:
          - positive_integer
          - max_value: 100000

output_payload:
  selected_docs:
    json_compatible: true
    fields:
      kb_id:
        type: string
      docs:
        type: array
        item:
          type: object
          fields:
            doc_id:
              type: string
            filename:
              type: string
            file_type:
              type: string
            status:
              type: string
            group_counts:
              type: object
              value_type: integer
      stats:
        type: object
        fields:
          matched:
            type: integer
          selected:
            type: integer
      params:
        type: object
        fields:
          kb_id:
            type: string
          max_docs:
            type: integer
          target_case_count:
            type: integer

behavior:
  responsibility:
    - 从 source_config 中读取 kb_id、max_docs 和 target_case_count。
    - 校验 kb_id 是非空 id。
    - 将 max_docs 和 target_case_count 归一化为正整数；默认值为 100，最大值为 100000。
    - 调用 KnowledgeBaseClient.list_documents(kb_id) 获取知识库文档列表。
    - 保持 KnowledgeBaseClient 返回的文档顺序，不主动排序。
    - 选择前 max_docs 个文档。
    - 如果没有选中任何文档，则 operation 失败。
    - 将每个选中文档归一化为 doc_id、filename、file_type、status 和 group_counts。
    - 构造包含 kb_id、docs、stats 和 params 的 selected_docs payload。
    - 只返回 {"selected_docs": payload}。
  not_responsibility:
    - 不读取 chunks 或 DocNode 内容。
    - 不生成 dataset cases。
    - 不决定问题类型分布。
    - 不直接写 artifact store。
    - 不返回旧版 ArtifactDraft 或 OperationOutput。
    - 不调用 ctx.report_progress，因为当前 materializer context 没有 progress hook。

tests:
  - contract
  - success
  - default_params
  - validation_error
  - empty_selection_error
  - normalize_optional_doc_fields
  - return_keys_match_outputs
