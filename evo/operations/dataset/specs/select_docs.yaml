operation:
  op_id: dataset.select_docs
  flow: dataset
  stage: select_docs
  description: 枚举尚需自动生成 case 的所有知识库文档，作为后续有效 chunk 扫描的可审计来源。

fixed_op:
  inputs:
    source_config:
      artifact_id: corpus.source_config
      required: true
      partition: unpartitioned
      mapping: same_partition
    import_cases_manifest:
      artifact_id: dataset.import_cases_manifest
      required: true
      partition: unpartitioned
  outputs:
    selected_docs:
      artifact_id: dataset.selected_docs
      partition: unpartitioned

materializer:
  function: select_docs
  return_keys:
    - selected_docs

input_payload:
  source_config:
    fields:
      kb_ids:
        # 用户配置的全部候选知识库，不是单个手工输入的 kb_id。
        type: list[string]
        required: true
        validation:
          - non_empty
          - non_empty_after_strip_items
          - unique_items
  import_cases_manifest:
    fields:
      stats:
        type: object
        required: true
        fields:
          case_allocation:
            type: object
            required: true
            fields:
              auto_case_count:
                # CSV 导入后仍需 qaplan/LLM 自动生成的 case 数。
                type: integer
                required: true

output_payload:
  selected_docs:
    json_compatible: true
    fields:
      kb_ids:
        type: list[string]
      docs:
        # 后续 chunk 扫描的扁平文档列表；每项保留其来源 kb_id。
        type: array
        item:
          type: object
          fields:
            kb_id:
              type: string
            doc_id:
              type: string
            filename:
              type: string
            file_type:
              type: string
            status:
              type: string
      stats:
        type: object
        fields:
          discovered_by_kb:
            # 每个 KB 实际枚举出的文档数；不再存在按比例截断的 selected 配额。
            type: object
            value_type: integer
          discovered:
            type: integer
      params:
        type: object
        fields:
          kb_ids:
            type: list[string]
          auto_case_count:
            type: integer

execution_flow:
  - 读取 source_config.kb_ids 与 import_cases_manifest.stats.case_allocation.auto_case_count。
  - 当 auto_case_count=0 时，不访问知识库，返回 docs=[] 与零值统计；静态下游 chunk partitions 仍由其自身占位逻辑处理。
  - 否则，对每个 kb_id 调用 KnowledgeBaseClient.list_documents，保留所有文档及各 KB 的原始返回顺序。
  - 每项保留原始 kb_id、doc_id、filename、file_type 与 status；此阶段不读取 group_counts，也不按文档数抽样。
  - 自动生成仍需要 case 时，如全局没有发现任何文档则直接失败。
  - 返回 {"selected_docs": payload}。

tests:
  document_discovery:
    # selected_docs 只固定扫描来源；候选比例完全由后续有效 chunk 容量决定。
    cases:
      # 不截断任一 KB 的文档；按 kb_ids 顺序和各 KB 内原始顺序输出全部文档。
      - enumerates_all_docs_in_stable_kb_and_document_order
      # 每个输出文档携带其原始 kb_id/doc_id，不构造或改写数据库 ID。
      - preserves_source_provenance_without_rewriting_ids
  imported_only_bypass:
    # 导入已覆盖全部目标时，自动链路不再访问知识库，但静态图仍能继续产出合法占位。
    cases:
      # auto_case_count=0 时返回空 docs 和零统计，不触发空选择错误。
      - no_kb_access_when_all_cases_imported
  validation:
    # 自动生成仍有需求时，KB 输入与发现结果必须合法。
    cases:
      # kb_ids 或 manifest 统计非法时直接失败；max_docs 不再是支持的参数。
      - contract_error
      # auto_case_count 大于零且没有发现任何文档时直接失败。
      - empty_discovery_error
