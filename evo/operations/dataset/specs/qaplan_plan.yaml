# 全局 Case 选题计划：只保存每个自动 Case 的唯一选题事实，不复制主题名称或引用正文。
operation:
  op_id: dataset.qaplan_plan
  flow: dataset
  stage: qaplan_plan
  description: 基于扁平 Topic 集合和完整六路整数数量，为自动 Case 分配唯一 topic_id。

fixed_op:
  inputs:
    import_cases_manifest:
      artifact_id: dataset.import_cases_manifest
      required: true
      partition: unpartitioned
    topic_discovery_manifest:
      artifact_id: dataset.topic_discovery_manifest
      required: true
      partition: unpartitioned
    qaplan_plan_params:
      artifact_id: dataset.qaplan_plan_params
      required: true
      partition: unpartitioned
  outputs:
    qaplan_plan:
      artifact_id: dataset.qaplan_plan
      partition: unpartitioned

materializer:
  function: qaplan_plan
  return_keys: [qaplan_plan]

input_payload:
  import_cases_manifest:
    fields:
      stats:
        fields:
          case_allocation:
            fields:
              target_case_count: {type: integer, required: true}
              import_case_count: {type: integer, required: true}
              auto_case_count: {type: integer, required: true}
              assignments: {type: object, required: true}
  topic_discovery_manifest:
    fields:
      topics:
        type: array
        required: true
        item:
          fields:
            topic_id: {type: string, required: true, validation: [non_empty_after_strip]}
            name: {type: string, required: true, validation: [non_empty_after_strip]}
            question_type: {type: string, required: true, enum: [precision, reasoning]}
            chunk_ids: {type: 'list[string]', required: true, validation: [non_empty, non_empty_after_strip_items]}
            chunk_count: {type: integer, required: true, validation: [positive_integer]}
  qaplan_plan_params:
    fields:
      lane_case_counts:
        # 前端提交时必须完整提供六路；缺席仅表示本次首次按 1:1 初始化。
        type: object
        required: false
        fields:
          precision_easy: {type: integer, required: true, validation: [non_negative_integer]}
          precision_medium: {type: integer, required: true, validation: [non_negative_integer]}
          precision_hard: {type: integer, required: true, validation: [non_negative_integer]}
          reasoning_easy: {type: integer, required: true, validation: [non_negative_integer]}
          reasoning_medium: {type: integer, required: true, validation: [non_negative_integer]}
          reasoning_hard: {type: integer, required: true, validation: [non_negative_integer]}

output_payload:
  qaplan_plan:
    json_compatible: true
    fields:
      items:
        type: array
        item:
          fields:
            case_id: {type: string}
            plan_item_id: {type: string}
            lane: {type: string, enum: [precision_easy, precision_medium, precision_hard, reasoning_easy, reasoning_medium, reasoning_hard]}
            question_type: {type: string, enum: [precision, reasoning]}
            difficulty: {type: string, enum: [easy, medium, hard]}
            # 首次分配的每 Case 唯一选题；单 Case 换主题不改写全局计划。
            topic_id: {type: string}
      stats:
        fields:
          target_case_count: {type: integer}
          import_case_count: {type: integer}
          auto_case_count: {type: integer}
          planned_case_count: {type: integer}
          lane_summaries:
            type: array
            item:
              fields:
                lane: {type: string}
                allocated_case_count: {type: integer}
                eligible_topic_count: {type: integer}
      params:
        fields:
          # 实际使用的六路整数数；不存在 ratio 或比例派生字段。
          lane_case_counts: {type: object, value_type: integer}
          # 商相同后的余数分配与 items 块顺序均使用这个固定顺序。
          lane_order: {type: 'list[string]'}

execution_flow:
  - 校验 assignments 覆盖每个稳定 Case 分区一次；仅 mode=generated 的 case_id 进入 items，数量必须等于 auto_case_count。
  - 当 auto_case_count=0 时返回 items=[] 与固定六路零值摘要；空 Topic 集合是合法结果。
  - lane_case_counts 存在时，必须完整、均为非负整数且总和等于 auto_case_count；不存在时仅为本次运行按固定 lane_order 做 1:1 整数初始化：先整除，再将余数依次分给前面的 lane。
  - 以 topic.question_type 和 topic.chunk_count >= 难度所需 1/2/3 个 Chunk 计算每路 eligible_topic_count；零配额也必须计算。
  - 每路配额不得超过 eligible_topic_count。同一 question_type + difficulty 的每个 topic_id 最多分配一次；不同题型或难度可复用同一 topic_id。
  - 在每个 lane 内按 Manifest topics 原始顺序选取 topic_id；items 按固定 lane_order 输出并绑定 generated case_id，生成稳定 plan_item_id。
  - 输出只保存 case_id、lane、题型、难度和 topic_id。主题名称、完整 references 与 instruction 由 qaplan_spec 从当前 Manifest/Chunk 派生。

tests:
  allocation:
    cases:
      # 未提交分布时，auto_case_count 先整除 6，再把余数按固定 lane_order 分给前几路；不读取或保存比例。
      - initializes_equal_one_to_one_counts_by_quotient_and_remainder
      # 显式分布必须完整包含六路，且六路之和恰好等于 auto_case_count。
      - accepts_only_complete_integer_lane_case_counts_with_matching_total
      # 导入 Case 不进入六路分配；只有 generated assignment 获得一个 plan item。
      - allocates_only_generated_case_ids
      # 每路按扁平 topics 的发现顺序选择，而非按名称、Cluster、分数或 Chunk 数重排。
      - selects_topic_ids_in_manifest_order
      # 同题型同难度不得重复 topic_id；不同难度或题型允许复用，符合可替换主题的占用规则。
      - enforces_topic_uniqueness_only_within_question_type_and_difficulty
      # 输出计划项只含唯一 topic_id 和分配元数据，不泄露 Cluster、topic name、references 或 instruction。
      - stores_only_topic_id_as_the_topic_selection_fact
      # 同一输入重复规划时，lane_order、plan_item_id 和 case_id -> topic_id 绑定必须完全一致。
      - deterministic_replanning_preserves_all_selection_bindings
      # 用户提交新完整分布后，旧六路数量不得隐式按历史比例换算或保留。
      - replaces_prior_distribution_without_ratio_carryover
  capacity_and_empty_results:
    cases:
      # easy/medium/hard 分别要求 chunk_count 至少为 1/2/3，且高 Chunk 数 Topic 可参与低难度路。
      - applies_cumulative_chunk_count_thresholds
      # 零配额路仍输出真实可用 Topic 数，支持前端展示和下一次完整分布校验。
      - reports_eligible_topic_count_for_zero_quota_lanes
      # 任一路配额超过可用 Topic 数时整个 operation 失败，不写入部分计划。
      - rejects_lane_count_exceeding_eligible_topic_capacity
      # imported-only run 即使没有任何 Topic 也完成并返回固定六路零摘要。
      - imported_only_empty_topic_collection_is_valid
      # auto_case_count 非零且某路没有符合题型/难度的 Topic 时，返回该路容量错误而非跨路借用 Topic。
      - never_crosses_question_type_or_difficulty_to_fill_a_lane
  contract_and_runtime:
    cases:
      # 重复或空 topic_id、题型不合法、chunk_count 与 chunk_ids 长度不一致时拒绝上游 Manifest。
      - rejects_invalid_flat_topic_contract
      # materializer 只返回声明的 qaplan_plan 输出键。
      - return_keys_match_outputs
      # 三个无分区输入收敛为一个版本化的全局 qaplan_plan Artifact。
      - unpartitioned_plan_wiring
      # assignments 缺失、重复、未知 mode 或 auto_case_count 与 generated 数量不一致时拒绝计划。
      - rejects_inconsistent_case_assignment_snapshot
