operation:
  op_id: dataset.qaplan_spec
  flow: dataset
  stage: qaplan_spec
  description: 按稳定 case 分区分发导入旁路或自动生成所需的 QA 规格。

fixed_op:
  inputs:
    qaplan_plan:
      artifact_id: dataset.qaplan_plan
      required: true
      partition: unpartitioned
      mapping: unpartitioned_to_all
    import_cases_manifest:
      artifact_id: dataset.import_cases_manifest
      required: true
      partition: unpartitioned
      mapping: unpartitioned_to_all
  outputs:
    qaplan_spec:
      artifact_id: dataset.qaplan_spec
      partition: partitioned

materializer:
  function: qaplan_spec
  return_keys:
    - qaplan_spec

input_payload:
  qaplan_plan:
    fields:
      items:
        type: array
        required: true
        item:
          type: object
          fields:
            case_id:
              type: string
              required: true
            question_type:
              type: string
              required: true
            difficulty:
              type: string
              required: true
            topic:
              type: string
              required: true
            references:
              type: array
              required: true
      stats:
        type: object
        required: true
        fields:
          auto_case_count:
            type: integer
            required: true
          planned_case_count:
            type: integer
            required: true
  import_cases_manifest:
    fields:
      stats:
        type: object
        required: true
        fields:
          case_allocation:
            type: object
            required: true
            fields:
              assignments:
                type: object
                required: true
      details:
        # imported case 由其 loaded detail 提供，不在 manifest 中维护第二份索引。
        type: array
        required: true

output_payload:
  qaplan_spec:
    json_compatible: true
    fields:
      id:
        type: string
      mode:
        # imported 直接透传 base case；generated 读取唯一 qaplan item。
        type: string
        enum:
          - imported
          - generated
      imported_case:
        # 已完成 CSV 校验、可直接作为 dataset.case 的基础 case。
        type: object
        required: false
        description: mode=imported 时的已规范化基础 case；generate 直接返回它。
      question_type:
        type: string
        required: false
        enum:
          - precision
          - reasoning
      difficulty:
        type: string
        required: false
        enum:
          - easy
          - medium
          - hard
      source:
        # generated case 实际引用到的 KB，而非整个运行配置的 KB 集合。
        type: object
        required: false
        fields:
          kb_ids:
            type: list[string]
      instruction:
        type: string
        required: false
      topic:
        type: string
        required: false
      qaplan:
        type: object
        required: false
      references:
        type: array
        required: false

execution_flow:
  - 读取当前 qaplan_spec 输出分区的稳定 case id，并从 import_cases_manifest.stats.case_allocation.assignments 查找唯一 assignment；缺失、未知 mode 或 assignment 与 runtime 分区不一致时直接失败。
  - mode=imported 时，要求 details 中存在 source_row_number 匹配 assignment、load_status=loaded 且 case.id 相同的完整规范化基础 case；输出 {id, mode=imported, imported_case}，不读取 qaplan_plan.items，不构造 instruction。
  - mode=generated 时，要求 qaplan_plan.items 中恰有一个 case_id 等于当前 id 的计划项；不得按 items 索引猜测分配，也不得使用导入 case 占位索引。
  - 对 generated item 校验 references 非空且数量符合 easy=1、medium=2、hard=3；每项 chunk_id、doc_id、text 均不能为空。
  - 根据 question_type 构造现有 precision 或 reasoning instruction，并复制计划项的 type、difficulty、topic、references 与 qaplan 追踪字段；source.kb_ids 由 references 中去重后的实际 kb_id 按首次出现顺序构造。
  - 返回 {"qaplan_spec": payload}。

tests:
  imported_bypass:
    # 导入分区的分配已经在 import_cases_manifest 冻结；qaplan spec 只传递已验证的 case。
    cases:
      # imported assignment 只产生带原分区 id 的 imported_case，不访问或消费 qaplan item。
      - imported_case_bypasses_plan_lookup
      # assignment 或 imported_case 缺失、id 不一致或基础 case 契约非法时直接失败。
      - imported_case_assignment_contract_error
  generated_spec:
    # 自动分区必须按显式 case_id 找到计划项，保证 CSV 导入位于任意静态分区时仍不发生错位。
    cases:
      # generated assignment 通过 plan item.case_id 唯一匹配，而非按全局 case 分区索引匹配。
      - generated_case_uses_explicit_plan_case_id
      # 生成路径保留现有 instruction、references、类型、难度与计划追踪元数据。
      - preserves_generated_qaplan_contract
      # 缺失、重复或错误绑定的 plan item 必须失败。
      - generated_plan_binding_error
  runtime_wiring:
    # 两个全局 manifest 均广播到每个静态 case 分区，输出仍是一分区一 qaplan_spec。
    cases:
      - partition
