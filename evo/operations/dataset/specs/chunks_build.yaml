# 将入围 Chunk 映射到运行时分区；有效但未入围的 Chunk 不进入后续算法。
operation:
  op_id: dataset.build_chunks
  flow: dataset
  stage: build_chunks
  description: 将每个已入围 Chunk 以其 chunk_id 直接写入同名 runtime partition。

fixed_op:
  inputs:
    build_chunk_candidates:
      artifact_id: dataset.build_chunk_candidates
      required: true
      mapping: unpartitioned_to_all
  outputs:
    chunk:
      artifact_id: dataset.chunk
      partition: partitioned

materializer:
  function: build_chunks
  return_keys: [chunk]

input_payload:
  build_chunk_candidates:
    fields:
      chunks: {type: array, required: true}

output_payload:
  chunk:
    json_compatible: true
    fields:
      available: {type: boolean}
      kb_id: {type: string, required: false}
      chunk_id: {type: string}
      doc_id: {type: string}
      filename: {type: string}
      group: {type: string}
      # 上游已规范化的标准版面类型；本 operation 原样透传，不重新判定 allowed_types。
      type: {type: string}
      text: {type: string}
      embedding: {type: object}
      metadata: {type: object}

execution_flow:
  - 只消费 selected=true 的 Chunk；每个输出 runtime partition_key 必须等于该 Chunk 的 chunk_id。
  - 未入围有效 Chunk 不进入后续实体、聚类或生成流程。
  - 不创建静态 Slot 或 available=false 占位；已入围 Chunk 的集合就是运行时分区集合。

tests:
  partition_mapping:
    cases:
      # 仅 selected=true 的 Chunk 进入与自身 chunk_id 同名的 runtime partition。
      - maps_selected_chunks_to_their_chunk_id_partitions
      # 有效但未入围的 Chunk 不得泄漏到实体提取、主题发现或生成输入。
      - effective_but_unselected_chunks_never_reach_runtime_partitions
      # 没有额外 Slot 或占位分区；未入围 Chunk 不创建 runtime 输出。
      - never_creates_placeholder_partitions_for_unselected_chunks
      # 映射后的真实 Chunk 必须逐字段保留来源、标准版面类型、正文、向量与 metadata。
      - selected_payload_preserves_source_text_embedding_and_metadata
      # materializer 返回键必须严格等于 FixedOp 输出键。
      - return_keys_match_outputs
