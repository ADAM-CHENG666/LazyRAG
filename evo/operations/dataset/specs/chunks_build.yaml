operation:
  op_id: dataset.build_chunks
  flow: dataset
  stage: build_chunks
  description: 基于 selected_docs 为指定数量的 runtime partitions 构建 dataset 候选 chunk slots。

fixed_op:
  inputs:
    selected_docs:
      artifact_id: dataset.selected_docs
      required: true
      partition: unpartitioned
      mapping: unpartitioned_to_all
    build_chunks_params:
      artifact_id: dataset.build_chunks_params
      required: true
      partition: unpartitioned
      mapping: unpartitioned_to_all
  outputs:
    chunk:
      artifact_id: dataset.chunk
      partition: partitioned

materializer:
  function: build_chunks
  return_keys:
    - chunk

input_payload:
  selected_docs:
    fields:
      kb_id:
        type: string
        required: true
      docs:
        type: array
        required: true
        item:
          type: object
          fields:
            doc_id:
              type: string
              required: true
            filename:
              type: string
              required: false
            file_type:
              type: string
              required: false
            status:
              type: string
              required: false
            group_counts:
              type: object
              required: false
              value_type: integer
      params:
        type: object
        required: false
        fields:
          target_case_count:
            type: integer
            required: false
            default: 100
  build_chunks_params:
    fields:
      groups:
        type: list[string]
        required: false
        default:
          - block
        validation:
          - non_empty_id_items

output_payload:
  chunk:
    json_compatible: true
    fields:
      available:
        type: boolean # 当输出 chunk 不足时，也需要使用无效 chunk 做占位，以满足当前静态声明设计
      chunk_id:
        type: string
      doc_id:
        type: string
      filename:
        type: string
      group:
        type: string
      type:
        type: string
      text:
        type: string
      embedding:
        type: object
        fields:
          model:
            type: string
          vector:
            type: list[number]
      metadata:
        type: object

execution_flow:
  - 读取并校验 selected_docs input payload。
  - 读取 build_chunks_params.groups；为空时使用 ["block"]。
  - 根据 selected_docs.params.target_case_count 在 graph 创建前确定 chunk slot 数量为 1.5 倍并向上取整。
  - 当 selected_docs.docs 为空时失败。
  - 要求 runtime 预先提供 target_chunk_count 个独立 chunk partitions。
  - 按 group-first 策略生成采样计划。
  - 当采样计划为空时失败。
  - 按采样计划调用 KnowledgeBaseClient.iter_chunks(kb_id, [doc_id], [group], page_size) 读取 DocNode。
  - 从知识库读取含 embedding 的 DocNode；缺失 embedding 时失败，不延迟到 topic 阶段处理。
  - 将每个 DocNode 的唯一 embedding 选择为 {model, vector}，校验数值、维度和正范数，并在此处完成 L2 归一化。
  - 将读取到的 DocNode 转换为 chunk payload；chunk_id 与 doc_id 必须保留知识库原始标识。
  - 按 runtime output chunk partition 选择当前 slot 对应的 chunk，真实 chunk 输出 available=true。
  - 当当前 slot 超过实际 chunk 数量时，输出 available=false 的空占位 chunk payload。
  - 返回仅包含当前 partition slot 的 {"chunk": payload}。

tests:
  - contract
  - success
  - default_groups
  - validation_error
  - empty_selected_docs_error
  - target_chunk_count_from_selected_docs
  - group_first_sampling_plan
  - proportional_doc_quota
  - fallback_group_warning
  - insufficient_chunks_placeholder
  - normalize_docnode_payload
  - partitioned_chunk_output
  - return_keys_match_outputs
  - partition
