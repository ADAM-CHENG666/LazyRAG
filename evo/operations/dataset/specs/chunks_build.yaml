operation:
  op_id: dataset.build_chunks
  flow: dataset
  stage: build_chunks
  description: 将自动生成侧的候选 chunk 映射到既有静态 runtime chunk partitions，不足部分输出占位。

fixed_op:
  inputs:
    build_chunk_candidates:
      artifact_id: dataset.build_chunk_candidates
      required: true
      mapping: unpartitioned_to_all
  outputs:
    chunk:
      artifact_id: dataset.chunk
      partition: partitioned

materializer:
  function: build_chunks
  return_keys:
    - chunk

input_payload:
  build_chunk_candidates:
    fields:
      chunks:
        type: array
        required: true
      params:
        type: object
        required: true

output_payload:
  chunk:
    json_compatible: true
    fields:
      available:
        # false 表示静态 slot 的占位，不应触发实体、聚类或 LLM 工作。
        type: boolean
      kb_id:
        # 真实 chunk 所属知识库；不参与 ID 拼接。
        type: string
        required: false
      chunk_id:
        # Topic 详情关联键；payload chunk_id 与静态 artifact partition 不一定相同。
        type: string
      doc_id:
        # Chunk 来源文档标识。
        type: string
      filename:
        # Chunk 详情中面向用户展示的来源文件名。
        type: string
      group:
        # Chunk 详情中展示的业务分组。
        type: string
      type:
        type: string
      text:
        # Chunk 正文；仅在用户点击 Chunk 详情时读取。
        type: string
      embedding:
        # 算法输入，STEP2 页面不读取或展示。
        type: object
      metadata:
        # 原始扩展信息，第一版 STEP2 页面不读取。
        type: object

execution_flow:
  - 读取 build_chunk_candidates，并按 runtime output partition 的稳定 index 选择当前 slot。
  - index 小于候选数量时，输出 available=true 的真实 chunk，原样保留 kb_id、chunk_id、doc_id 和正文。
  - index 超过候选数量时，输出 available=false 的空占位 chunk；静态 partition 数量不因 CSV 导入而变化。
  - 当没有自动生成侧候选（例如全部 case 均已导入）时，全部静态 slots 都必须输出 available=false，占位不会触发后续 LLM 调用。
  - 返回仅包含当前 partition slot 的 {"chunk": payload}。

tests:
  static_partition_mapping:
    # CSV 只缩减真实自动生成材料，不改变 DAG 静态声明的 chunk slot 数量。
    cases:
      # 真实候选按稳定 partition index 映射，并保留 kb_id/doc_id/chunk_id 原值。
      - maps_candidates_with_source_provenance
      # 候选不足时继续使用现有 available=false 占位，而不是删减 runtime partitions。
      - insufficient_chunks_placeholder
      # import_case_count=target_case_count 时没有自动生成候选，所有 slots 均为占位。
      - all_imported_cases_produce_only_placeholders
      # materializer 只返回当前 partition 的 chunk output。
      - return_keys_match_outputs
