operation:
  op_id: dataset.build_chunks
  flow: dataset
  stage: build_chunks
  description: 基于 selected_docs 为指定数量的 runtime partitions 构建 dataset 候选 chunk slots。

fixed_op:
  inputs:
    build_chunk_candidates:
      artifact_id: dataset.build_chunk_candidates
      required: true
      mapping: unpartitioned_to_all
  outputs:
    chunk:
      artifact_id: dataset.chunk
      partition: partitioned

materializer:
  function: build_chunks
  return_keys:
    - chunk

input_payload:
  build_chunk_candidates:
    fields:
      chunks:
        type: array
        required: true
      target_chunk_count:
        type: integer
        required: true
      params:
        type: object
        required: true

output_payload:
  chunk:
    json_compatible: true
    fields:
      available:
        type: boolean # 当输出 chunk 不足时，也需要使用无效 chunk 做占位，以满足当前静态声明设计
      chunk_id:
        type: string
      doc_id:
        type: string
      filename:
        type: string
      group:
        type: string
      type:
        type: string
      text:
        type: string
      embedding:
        type: object
        fields:
          model:
            type: string
          vector:
            type: list[number]
      metadata:
        type: object

execution_flow:
  - 读取 build_chunk_candidates。
  - 按 runtime output partition 的 index 从候选列表选择一个 chunk。
  - 按 runtime output chunk partition 选择当前 slot 对应的 chunk，真实 chunk 输出 available=true。
  - 当当前 slot 超过实际 chunk 数量时，输出 available=false 的空占位 chunk payload。
  - 返回仅包含当前 partition slot 的 {"chunk": payload}。

tests:
  - contract
  - success
  - insufficient_chunks_placeholder
  - partitioned_chunk_output
  - return_keys_match_outputs
  - partition
