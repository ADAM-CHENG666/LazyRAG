# 将入围 Chunk 映射到运行时分区；有效但未入围的 Chunk 不进入后续算法。
operation:
  op_id: dataset.build_chunks
  flow: dataset
  stage: build_chunks
  description: 按 selection_index 将已入围 Chunk 写入 runtime chunk partitions，不足部分输出占位。

fixed_op:
  inputs:
    build_chunk_candidates:
      artifact_id: dataset.build_chunk_candidates
      required: true
      mapping: unpartitioned_to_all
  outputs:
    chunk:
      artifact_id: dataset.chunk
      partition: partitioned

materializer:
  function: build_chunks
  return_keys: [chunk]

input_payload:
  build_chunk_candidates:
    fields:
      chunks: {type: array, required: true}

output_payload:
  chunk:
    json_compatible: true
    fields:
      available: {type: boolean}
      kb_id: {type: string, required: false}
      chunk_id: {type: string}
      doc_id: {type: string}
      filename: {type: string}
      group: {type: string}
      # 上游已规范化的标准版面类型；本 operation 原样透传，不重新判定 allowed_types。
      type: {type: string}
      text: {type: string}
      embedding: {type: object}
      metadata: {type: object}

execution_flow:
  - 只消费 selected=true 的 Chunk，并按 selection_index 升序映射到稳定 runtime partition。
  - 未入围有效 Chunk 不进入后续实体、聚类或生成流程。
  - 没有对应入围项的 partition 输出 available=false 占位。

tests:
  partition_mapping:
    cases:
      # 仅 selected=true 的 Chunk 按 selection_index 升序进入对应 runtime partition。
      - maps_only_selected_chunks_in_selection_index_order
      # 有效但未入围的 Chunk 不得泄漏到实体提取、主题发现或生成输入。
      - effective_but_unselected_chunks_never_reach_runtime_partitions
      # 入围 Chunk 少于静态 partition 数时，剩余 partition 必须输出 available=false。
      - insufficient_selected_chunks_produce_placeholders
      # 映射后的真实 Slot 必须逐字段保留来源、标准版面类型、正文、向量与 metadata。
      - selected_payload_preserves_source_text_embedding_and_metadata
      # materializer 返回键必须严格等于 FixedOp 输出键。
      - return_keys_match_outputs
