# 导入已有 case；CSV 文件与 Core 评测集投影共用同一行级契约。
operation:
  op_id: dataset.import_cases
  flow: dataset
  stage: import_cases
  description: 在 case 分区创建前校验并冻结导入结果；没有导入源时按生成计划创建 case。

fixed_op:
  inputs:
    source_config:
      artifact_id: corpus.source_config
      required: true
      partition: unpartitioned
      mapping: same_partition
  outputs:
    import_cases_manifest:
      artifact_id: dataset.import_cases_manifest
      partition: unpartitioned

materializer:
  function: import_cases
  return_keys:
    - import_cases_manifest

input_payload:
  source_config:
    fields:
      kb_ids:
        type: list[string]
        required: true
      csv_sources:
        type: array
        required: false
        item:
          fields:
            kb_id: {type: string}
            path: {type: string}
      imported_cases:
        # Core 评测集按导入字段投影；行为与 CSV 行一致。
        type: array
        required: false
        item: {type: object}
      target_case_count:
        type: integer
        required: true
        validation: [positive_integer]

case_contract:
  required: [question, question_type, ground_truth, grading_guidance]
  optional:
    - case_id
    - difficulty
    - key_points
    - forbidden_claims
    - reference_context
    - reference_doc
    - reference_doc_ids
    - reference_chunk_ids
    - generate_reason
    - is_deleted
  question_type:
    enum: [precision, reasoning]
  reference_validation:
    - 仅校验已提供的 doc_id、chunk_id 是否存在于本轮知识库。
    - 不按引用文本匹配，不补全缺失引用，不执行回退。

output_payload:
  import_cases_manifest:
    fields:
      source:
        fields:
          csv_sources: {type: array}
      stats:
        fields:
          csv_reading:
            fields:
              total_row_count: {type: integer}
              valid_row_count: {type: integer}
              loaded_row_count: {type: integer}
              invalid_row_count: {type: integer}
              deleted_row_count: {type: integer}
              truncated_row_count: {type: integer}
          case_allocation:
            fields:
              target_case_count: {type: integer}
              import_case_count: {type: integer}
              auto_case_count: {type: integer}
              assignments: {type: object}
      details:
        type: array
        item:
          fields:
            source_row_number: {type: integer}
            load_status:
              type: string
              enum: [loaded, invalid, deleted]
            case_id: {type: string, required: false}
            error: {type: object, required: false}
            case: {type: object, required: false}

execution_flow:
  - 没有导入源时，按 target_case_count 生成 assignments，全部标记为 generated。
  - 有导入源时逐行校验；无效行与删除行不进入最终数据集。
  - 至少存在一个有效导入 case，否则 operation 失败。
  - 导入模式不截断；未启用补充时，target_case_count 等于有效导入 case 数。
  - 启用补充时，target_case_count 不小于有效导入 case 数，其余分区标记为 generated。
  - 导入 case 直接进入完成态，未提供的可选字段保持为空。

tests:
  - minimal_required_fields
  - supported_question_types_only
  - optional_reference_ids_are_validated
  - inline_eval_set_and_csv_share_contract
  - imported_count_defines_target
  - imported_case_finalizes_without_generation
