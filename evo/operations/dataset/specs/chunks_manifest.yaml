operation:
  op_id: dataset.build_chunks_manifest
  flow: dataset
  stage: build_chunks_manifest
  description: 汇总 build_chunks 输出的所有 chunk slots，生成全局 chunk manifest。

fixed_op:
  inputs:
    selected_docs:
      artifact_id: dataset.selected_docs
      required: true
      partition: unpartitioned
    import_cases_manifest:
      # 提供自动侧剩余 case 数，用于解释真实 chunk 与占位 slot 的差异。
      artifact_id: dataset.import_cases_manifest
      required: true
      partition: unpartitioned
    build_chunk_candidates:
      artifact_id: dataset.build_chunk_candidates
      required: true
      partition: unpartitioned
    chunk:
      artifact_id: dataset.chunk
      required: true
      partition: partitioned
      mapping: all_to_unpartitioned
  outputs:
    build_chunks_manifest:
      artifact_id: dataset.build_chunks_manifest
      partition: unpartitioned

materializer:
  function: build_chunks_manifest
  return_keys:
    - build_chunks_manifest

input_payload:
  selected_docs:
    fields:
      kb_ids:
        type: list[string]
        required: true
      docs:
        type: array
        required: true
        item:
          type: object
          fields:
            kb_id:
              type: string
              required: true
            doc_id:
              type: string
              required: true
            filename:
              type: string
              required: false
            file_type:
              type: string
              required: false
            status:
              type: string
              required: false
  build_chunk_candidates:
    fields:
      chunks:
        type: array
        required: true
      selection_stats:
        type: object
        required: true
        fields:
          target:
            type: object
          scan:
            type: object
          eligibility:
            type: object
          allocation:
            # 包含 fallback_used 与 group -> KB -> doc 三级配额审计。
            type: object
      params:
        type: object
        required: true
  import_cases_manifest:
    fields:
      stats:
        type: object
        required: true
        fields:
          case_allocation:
            type: object
            required: true
            fields:
              auto_case_count:
                type: integer
                required: true
  chunk:
    tuple: true
    item:
      fields:
        available:
          type: boolean
          required: true
        kb_id:
          type: string
          required: false
        chunk_id:
          type: string
          required: true
        doc_id:
          type: string
          required: true
        filename:
          type: string
          required: false
          default: ""
        group:
          type: string
          required: true
        type:
          type: string
          required: false
          default: text
        text:
          type: string
          required: false
          default: ""
        embedding:
          type: object
          required: false
          default: {}
        metadata:
          type: object
          required: false
          default: {}

output_payload:
  build_chunks_manifest:
    json_compatible: true
    fields:
      source:
        # 选中文档可来自多个 KB；真实 chunk 自身保留具体 kb_id。
        type: object
        fields:
          kb_ids:
            type: list[string]
          selected_docs_ref:
            type: string
            required: false
      chunks:
        # 与静态 runtime slot 一一对应，available=false 代表合法占位。
        type: array
        item:
          type: object
          fields:
            available:
              # false 表示静态占位，不应进入有效 Chunk 详情。
              type: boolean
            kb_id:
              type: string
            chunk_id:
              # 与 topic_discovery_manifest.clusters[].chunk_ids 关联。
              type: string
            doc_id:
              # Chunk 来源文档标识。
              type: string
            filename:
              # Chunk 来源文件名，可在读取正文前先展示。
              type: string
            group:
              # Chunk 所属业务分组。
              type: string
            type:
              type: string
            partition:
              # 定位 partitioned dataset.chunk 的运行时分区；点击 Chunk 详情时使用。
              type: string
      stats:
        type: object
        fields:
          auto_case_count:
            type: integer
          slots:
            # 静态 runtime slot 的总体使用情况。
            type: object
            fields:
              total_count:
                type: integer
              available_count:
                type: integer
              placeholder_count:
                type: integer
          candidate_selection:
            # 原样承接 build_chunk_candidates.selection_stats 的四块审计结构。
            type: object
            fields:
              target:
                type: object
              scan:
                type: object
              eligibility:
                type: object
              allocation:
                type: object
          source_coverage:
            # 最终 available chunk 覆盖的 doc/group 情况。
            type: object
            fields:
              doc_count:
                type: integer
              group_counts:
                type: object
                value_type: integer
              documents:
                type: array
                item:
                  type: object
                  fields:
                    doc_id:
                      type: string
                    filename:
                      type: string
                    total_count:
                      type: integer
                    group_counts:
                      type: object
                      value_type: integer
          warnings:
            type: list[string]
      params:
        type: object
        fields:
          groups:
            type: list[string]
          allowed_types:
            type: list[string]
          max_scan_docs_per_kb:
            type: integer
          max_scan_chunks:
            type: integer

execution_flow:
  - 读取并校验 selected_docs input payload。
  - 读取 import_cases_manifest.stats.case_allocation.auto_case_count，以及 build_chunk_candidates 的筛选统计和参数。
  - 读取 all_to_unpartitioned 汇总后的 chunk tuple。
  - 要求 chunk tuple 的数量等于 flow 声明的静态 runtime chunk slot 数。
  - 按 runtime partition 顺序将 chunk slots 归一化为 build_chunks_manifest.chunks 项。
  - 每个 manifest 项保留 available、kb_id、chunk_id、doc_id、filename、group、type 和 partition；不拼接或改写数据库 ID。
  - 在 stats.slots 中汇总 total_count、available_count 和 placeholder_count。
  - 将候选阶段的 target、scan、eligibility、allocation 四块审计原样写入 stats.candidate_selection。
  - 在 stats.source_coverage 中汇总最终 available chunk 的 doc_count、group_counts 与逐文档覆盖情况。
  - 汇总 auto_case_count 与 warnings。
  - 返回 {"build_chunks_manifest": payload}。

tests:
  manifest_assembly:
    # manifest 仅收口静态 slot；真实 chunk 数量可因 CSV 导入而少于静态 slot 数量。
    cases:
      # 每个真实项保留 kb_id、doc_id、chunk_id 原值，且按 runtime partition 顺序汇总。
      - preserves_provenance_and_partition_order
      # 全部 case 均导入时允许全部 unavailable slot，形成可供主题链路消费的合法 manifest。
      - all_placeholder_manifest_for_imported_only_run
      # tuple 数量仍必须等于静态 runtime slot 数；不可因候选不足而缺少 partition 输出。
      - static_tuple_count_mismatch_error
  audit_stats:
    # stats 固定分为 slots、candidate_selection、source_coverage，并单独记录 auto_case_count/warnings。
    cases:
      # slots、auto_case_count 与 candidate_selection 中的目标/选择/短缺统计能相互复核。
      - records_import_aware_hierarchical_selection_stats
      # candidate_selection 原样保留 target、scan、eligibility、allocation 四块，避免扁平字段漂移。
      - preserves_structured_candidate_selection_audit
      # source_coverage 仅描述最终 available chunk 的文档与 group 覆盖，不混入扫描容量统计。
      - separates_final_source_coverage_from_candidate_capacity
      # 返回结构固定为单一 build_chunks_manifest output。
      - return_keys_match_outputs
