operation:
  op_id: dataset.build_chunks_manifest
  flow: dataset
  stage: build_chunks_manifest
  description: 汇总 build_chunks 输出的所有 chunk slots，生成全局 chunk manifest。

fixed_op:
  inputs:
    selected_docs:
      artifact_id: dataset.selected_docs
      required: true
      partition: unpartitioned
    import_cases_manifest:
      # 提供自动侧剩余 case 数，用于解释真实 chunk 与占位 slot 的差异。
      artifact_id: dataset.import_cases_manifest
      required: true
      partition: unpartitioned
    build_chunk_candidates:
      artifact_id: dataset.build_chunk_candidates
      required: true
      partition: unpartitioned
    chunk:
      artifact_id: dataset.chunk
      required: true
      partition: partitioned
      mapping: all_to_unpartitioned
  outputs:
    build_chunks_manifest:
      artifact_id: dataset.build_chunks_manifest
      partition: unpartitioned

materializer:
  function: build_chunks_manifest
  return_keys:
    - build_chunks_manifest

input_payload:
  selected_docs:
    fields:
      kb_ids:
        type: list[string]
        required: true
      docs:
        type: array
        required: true
        item:
          type: object
          fields:
            kb_id:
              type: string
              required: true
            doc_id:
              type: string
              required: true
            filename:
              type: string
              required: false
            file_type:
              type: string
              required: false
            status:
              type: string
              required: false
            group_counts:
              type: object
              required: false
              value_type: integer
      params:
        type: object
        required: false
        fields:
          target_case_count:
            type: integer
            required: false
            default: 100
  build_chunk_candidates:
    fields:
      chunks:
        type: array
        required: true
      selection_stats:
        type: object
        required: true
        fields:
          scanned_count:
            type: integer
          accepted_count:
            type: integer
          filtered_count_by_type:
            type: object
            value_type: integer
      fallback_used:
        type: boolean
        required: true
      params:
        type: object
        required: true
  import_cases_manifest:
    fields:
      stats:
        type: object
        required: true
        fields:
          case_allocation:
            type: object
            required: true
            fields:
              auto_case_count:
                type: integer
                required: true
  chunk:
    tuple: true
    item:
      fields:
        available:
          type: boolean
          required: true
        kb_id:
          type: string
          required: false
        chunk_id:
          type: string
          required: true
        doc_id:
          type: string
          required: true
        filename:
          type: string
          required: false
          default: ""
        group:
          type: string
          required: true
        type:
          type: string
          required: false
          default: text
        text:
          type: string
          required: false
          default: ""
        embedding:
          type: object
          required: false
          default: {}
        metadata:
          type: object
          required: false
          default: {}

output_payload:
  build_chunks_manifest:
    json_compatible: true
    fields:
      source:
        # 选中文档可来自多个 KB；真实 chunk 自身保留具体 kb_id。
        type: object
        fields:
          kb_ids:
            type: list[string]
          selected_docs_ref:
            type: string
            required: false
      chunks:
        # 与静态 runtime slot 一一对应，available=false 代表合法占位。
        type: array
        item:
          type: object
          fields:
            available:
              type: boolean
            kb_id:
              type: string
            chunk_id:
              type: string
            doc_id:
              type: string
            filename:
              type: string
            group:
              type: string
            type:
              type: string
            partition:
              type: string
      stats:
        type: object
        fields:
          chunk_count:
            type: integer
          slot_count:
            type: integer
          empty_count:
            type: integer
          scanned_count:
            type: integer
          accepted_count:
            type: integer
          filtered_count_by_type:
            type: object
            value_type: integer
          doc_count:
            type: integer
          group_counts:
            type: object
            value_type: integer
          doc_group_stats:
            type: array
            item:
              type: object
              fields:
                doc_id:
                  type: string
                filename:
                  type: string
                total:
                  type: integer
                groups:
                  type: object
                  value_type: integer
          fallback_used:
            type: boolean
          warnings:
            type: list[string]
      params:
        type: object
        fields:
          groups:
            type: list[string]
          allowed_types:
            type: list[string]
          auto_case_count:
            type: integer

execution_flow:
  - 读取并校验 selected_docs input payload。
  - 读取 import_cases_manifest.stats.case_allocation.auto_case_count，以及 build_chunk_candidates 的筛选统计和参数。
  - 读取 all_to_unpartitioned 汇总后的 chunk tuple。
  - 要求 chunk tuple 的数量等于 flow 声明的静态 runtime chunk slot 数。
  - 按 runtime partition 顺序将 chunk slots 归一化为 build_chunks_manifest.chunks 项。
  - 每个 manifest 项保留 available、kb_id、chunk_id、doc_id、filename、group、type 和 partition；不拼接或改写数据库 ID。
  - 统计 available=true 的真实 chunk 数量为 chunk_count。
  - 统计 available=false 的占位 slot 数量为 empty_count。
  - 直接使用候选构建阶段提供的 scanned_count、accepted_count 和 filtered_count_by_type。
  - 汇总 slot_count、auto_case_count、doc_count、group_counts、doc_group_stats、fallback_used 和 warnings。
  - 返回 {"build_chunks_manifest": payload}。

tests:
  manifest_assembly:
    # manifest 仅收口静态 slot；真实 chunk 数量可因 CSV 导入而少于静态 slot 数量。
    cases:
      # 每个真实项保留 kb_id、doc_id、chunk_id 原值，且按 runtime partition 顺序汇总。
      - preserves_provenance_and_partition_order
      # 全部 case 均导入时允许全部 unavailable slot，形成可供主题链路消费的合法 manifest。
      - all_placeholder_manifest_for_imported_only_run
      # tuple 数量仍必须等于静态 runtime slot 数；不可因候选不足而缺少 partition 输出。
      - static_tuple_count_mismatch_error
  audit_stats:
    # 统计同时说明真实自动生成材料和静态占位，方便定位导入对自动链路的影响。
    cases:
      # chunk_count、empty_count、auto_case_count、筛选统计和候选 target 能相互复核。
      - records_import_aware_selection_stats
      # 返回结构固定为单一 build_chunks_manifest output。
      - return_keys_match_outputs
