operation:
  op_id: dataset.topic_discovery_embedding_label
  flow: dataset
  stage: topic_discovery_embedding_label
  description: 使用 LLM 为一个 embedding candidate 动态分区生成 topics。

fixed_op:
  inputs:
    request:
      artifact_id: dataset.embedding_label_request
      required: true
      partition: partitioned
      mapping: each
    topic_discovery_embedding_label_params:
      artifact_id: dataset.topic_discovery_embedding_label_params
      required: true
      partition: unpartitioned
  outputs:
    embedding_cluster:
      artifact_id: dataset.embedding_cluster
      partition: partitioned

materializer:
  function: topic_discovery_embedding_label_cluster
  return_keys:
    - embedding_cluster

input_payload:
  request:
    fields:
      candidate_id:
        type: string
        required: true
      cluster_type:
        type: string
        required: true
        enum:
          - embedding
      chunk_ids:
        type: list[string]
        required: true
        validation:
          - non_empty
      chunk_count:
        type: integer
        required: true
      scores:
        type: object
        required: false
        default: {}
      metadata:
        type: object
        required: false
        default: {}
      chunks:
        type: array
        required: true
        item:
          type: object
          fields:
            chunk_id:
              type: string
              required: true
            kb_id:
              type: string
              required: false
            doc_id:
              type: string
              required: true
            text:
              type: string
              required: true
  topic_discovery_embedding_label_params:
    fields:
      max_topics_per_cluster:
        type: integer
        required: false
        default: 3
        validation:
          - positive_integer
          - max_value: 20
      max_chars_per_chunk_for_label:
        type: integer
        required: false
        default: 2048
        validation:
          - positive_integer
          - max_value: 20000
      max_label_source_chunks:
        type: integer
        required: false
        default: 8
        validation:
          - positive_integer

output_payload:
  embedding_cluster:
    json_compatible: true
    fields:
      cluster_id:
        # 取值等于上游 candidate_id；保持最终 embedding_clusters 的既有 cluster_id 契约。
        type: string
      cluster_type:
        type: string
        enum:
          - embedding
      topics:
        # 当前 candidate 唯一允许人工修改的字段。
        type: list[string]
      chunk_ids:
        # 支撑该 candidate 的 Chunk，按输入顺序保留。
        type: list[string]
      chunk_count:
        type: integer
      scores:
        type: object
      metadata:
        type: object
        required: false


execution_flow:
  - 解析并校验 topic_discovery_embedding_label_params。
  - 读取当前动态分区的 embedding_label_request；每个 attempt 只处理一个 candidate。
  - 对该 candidate 按 chunk_ids 原顺序选择前 max_label_source_chunks 个 chunk。
  - 使用截断后的 chunk text 和 max_topics_per_cluster 构造 LLM prompt。
  - 调用 LLM，解析并校验 topics 为非空 list[string]。
  - 当前 candidate 解析失败、topics 为空或 LLM 失败时仅使该动态分区失败。
  - 输出同一 candidate_id 的单一 embedding_cluster；并发由 Runtime 既有全局配置控制。

tests:
  label_generation_logic:
    # 单 candidate 标注：看动态分区如何选取 source chunks、构造 prompt 并保留元数据。
    cases:
      # 正常 request 只调用一次 LLM，并产出以同一 candidate_id 为 cluster_id 的 embedding_cluster。
      - success
      # 空参数输入时使用已有默认 max_topics / max_chars / max_source_chunks。
      - default_params
      # 只取前 max_label_source_chunks 个 chunk 参与 prompt 构造。
      - label_source_chunk_limit
      # 单个 chunk 文本在进入 prompt 前会按 max_chars_per_chunk_for_label 截断。
      - chunk_text_truncation
      # LLM 返回 topics 数量不得超过 max_topics_per_cluster，超限时直接失败。
      - max_topics_limit
      # 输出必须保留 request 的 candidate_id（作为 cluster_id）、chunk_ids、scores 和 metadata，不因标注过程重排。
      - preserves_chunk_ids
      # materializer 返回结构固定为 {"embedding_cluster": payload}，不混入额外字段。
      - return_keys_match_outputs
  llm_and_input_validation:
    # LLM 与输入校验：当前分区失败，不在这里发布聚合结果。
    cases:
      # request 必须包含 candidate_id、chunk_ids 与完整 chunks；chunk_id 顺序必须匹配。
      - contract
      # 参数必须是正整数且满足上限约束；非法参数应立即抛错。
      - validation_error
      # request 中 chunk 缺失文本或与 chunk_ids 不匹配时，不继续调用 LLM，直接失败。
      - missing_chunk_text_error
      # LLM 返回 topics=[] 或 topics 含空字符串时直接失败，不接受空标签。
      - empty_topics_error
      # LLM 返回非法 JSON、缺少 topics 字段或 topics 不是 list[string] 时直接失败。
      - invalid_llm_output_error
  runtime_wiring:
    # fixed op 接线：每个 request 动态分区独立建立 attempt，受既有 Runtime 全局并发配置限制。
    cases:
      - partition
