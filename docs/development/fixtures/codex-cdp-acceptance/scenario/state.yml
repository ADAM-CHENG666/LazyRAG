initial: __start__
transitions:
  __start__: [{to: prepare}]
  prepare: [{to: interrupt}]
  interrupt: [{to: retry}]
  retry: [{to: finish}]
  finish: [{to: __end__}]
steps:
  prepare:
    label: 1 · 准备与审核
    mode: human
    prompt: |
      这是专用于用户手动验收的外部执行 Workflow。所有步骤由当前 Codex 执行。
      将一句话“准备完成，请在 Panel 点击审核/继续，下一步有 90 秒停止窗口。”发布到 preparation 文本槽。
      文本同时记录当前 step_contract.attempt_no 和 operation，便于回退后比较。
      使用有效 execution_handle 提交 succeeded 后结束本轮，等待用户在 Panel 操作。不得代用户审核。
    outputs: [{material: preparation, required: true}]
    acceptance_criteria: preparation 为包含操作指引、attempt_no 和 operation 的非空短文本。
  interrupt:
    label: 2 · 中断窗口（90秒）
    mode: human
    prompt: |
      这是原聊天中断测试，不是内部脚本执行。使用当前 Codex 原生工具，不委派子 Agent。
      成功取得本步骤 execution_handle 后，判断本次是否为首次执行：
      若 step_contract.attempt_no=1 且 operation 不是 resume/retry/rewind，且本 run 的聊天历史尚无本步骤“停止窗口已开始”的提示：
      先发进度提示“停止窗口已开始：请在 90 秒内点击 LazyMind Panel 的停止，不要点 Codex 自己的停止。”
      随后用宿主可中断等待工具连续等待 3 次、每次 30 秒；没有等待工具时可用原生终端的 Python time.sleep(30)，等待每次命令结束。
      等待中不发布最终产物、不提交 succeeded、不结束当前轮次；被中断后不得自行续跑或提交。
      恢复、重试、回退或聊天历史已出现该提示时，跳过等待，便于观察是否真的恢复。
      若 90 秒结束而用户未停止，则正常完成，但文本必须明确“未观察到用户中断，不算中断验收通过”。
      将实际观察和当前 attempt_no、operation 发布到 interrupt_result 文本槽，再提交 succeeded。
      只陈述实际发生的事情，不虚构中断已成功。提交后结束本轮，等待 Panel 审核。
    inputs: [{material: preparation, required: true}]
    outputs: [{material: interrupt_result, required: true}]
    acceptance_criteria: interrupt_result 包含本次执行信息，并准确区分恢复执行与等待自然结束。
  retry:
    label: 3 · 失败与重试
    mode: human
    prompt: |
      这是故意耗尽三次自动执行预算的验收步骤，必须让用户在 Panel 手动点击重试。
      若 step_contract.attempt_no<=3 且 operation 不是 rewind/resume（automatic retry 的 operation 也可能为 retry，不能据此提前成功）：
      先向 retry_result 发布文本“预期首次失败，等待用户点击重试”，再使用当前 execution_handle 调用 workflow.step.complete，outcome=failed，error_code=CONTROL_SMOKE_EXPECTED_FAILURE，summary=这是预期的首次失败，请在 Panel 点击重试。
      按 Core 返回状态处理：automatic_retry_steps 仍有本步骤时，依协议调用 step.begin 重试；预算耗尽、continuation=failed 时告知用户点击重试并结束本轮。不得代用户操作 Panel。
      若 attempt_no>3 或 operation 为 rewind/resume：
      将“手动重试执行成功”及真实 attempt_no、operation 发布到 retry_result 文本槽，然后提交 succeeded。
      提交后结束本轮，等待 Panel 审核。若宿主无法执行指定 MCP 操作，明确报告，不以普通文字代替实际失败提交。
    inputs: [{material: interrupt_result, required: true}]
    outputs: [{material: retry_result, required: true}]
    acceptance_criteria: 重试后 retry_result 非空，包含真实 attempt_no 和 operation；首次失败是预期验收事件。
  finish:
    label: 4 · 完成与回退
    mode: human
    prompt: |
      读取 preparation、interrupt_result 和 retry_result，将三者简要汇总到 report 文本槽。
      追加当前 attempt_no 和 operation，并提示：审核完成后可使用 Panel“回退到步骤”选择“1 · 准备与审核”，验证原聊天重新执行。
      只记录已有证据；不要把仍未执行的回退、开关测试或中断测试写成通过。
      提交 succeeded 后结束本轮，等待用户最终审核。不要自行回退或新建 Workflow。
    inputs:
      - {material: preparation, required: true}
      - {material: interrupt_result, required: true}
      - {material: retry_result, required: true}
    outputs: [{material: report, required: true}]
    acceptance_criteria: report 是准确汇总已有结果并包含回退验收指引的短文本。
